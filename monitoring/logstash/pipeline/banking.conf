input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [service] {
    mutate { add_field => { "[@metadata][index]" => "banking-logs-%{service}" } }
  } else {
    mutate { add_field => { "[@metadata][index]" => "banking-logs-unknown" } }
  }

  # Parse timestamp from @timestamp if present
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Mask mobile numbers (10 digits starting with 6-9)
  if [message] {
    mutate {
      gsub => ["message", "[6-9]\\d{9}", "XXXXXXXXXX"]
    }
  }

  # Mask Aadhaar (12 consecutive digits)
  if [message] {
    mutate {
      gsub => ["message", "\\b\\d{12}\\b", "XXXXXXXXXXXX"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "banking-logs-%{+YYYY.MM.dd}"
    template_name => "banking-logs"
  }
}
