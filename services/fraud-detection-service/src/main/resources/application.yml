spring:
  application:
    name: fraud-detection-service
  datasource:
    url: jdbc:postgresql://localhost:5434/banking?currentSchema=fraud
    username: ${POSTGRES_USER:banking}
    password: ${POSTGRES_PASSWORD:banking123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    schemas: fraud
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detection-service-cg

server:
  port: 8090
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

fraud:
  velocity:
    max-transactions-per-hour: 10
  large-transaction:
    threshold: 500000
  auto-freeze:
    alert-count-threshold: 3
    alert-window-hours: 24
  blacklist:
    refresh-interval-ms: 300000

logging:
  level:
    com.banking.fraud: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
