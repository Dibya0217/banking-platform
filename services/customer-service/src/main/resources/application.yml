spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5434/banking?currentSchema=customer
    username: ${POSTGRES_USER:banking}
    password: ${POSTGRES_PASSWORD:banking123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    schemas: customer
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8082
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

internal:
  secret: ${INTERNAL_SECRET:internal-secret-change-me}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.banking.customer: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
