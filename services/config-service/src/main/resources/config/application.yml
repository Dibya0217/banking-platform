# Shared configuration served to all microservices by the Config Service.
# Individual services may override any of these values in their own application.yml.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.banking: DEBUG

spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
